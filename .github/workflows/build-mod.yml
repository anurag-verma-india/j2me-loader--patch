name: Build Mod APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch TinySoundFont
        run: |
          D=app/src/main/cpp/mmapi_tsf/TinySoundFont
          rm -rf $D
          git clone https://github.com/schellingb/TinySoundFont.git $D
          git -C $D checkout 92a8f0e9fe3c98358be7d8564db21fc4b1142d04
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew && ./gradlew assembleDevRelease
      - uses: actions/upload-artifact@v4
        with:
          name: J2ME-Loader-Mod
          path: app/build/outputs/apk/dev/release/*.apk

