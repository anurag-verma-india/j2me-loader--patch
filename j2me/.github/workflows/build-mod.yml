name: Build Mod APK
on:
  workflow_dispatch:
  push:
    branches: [mod]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew && ./gradlew assembleDevRelease
      - uses: actions/upload-artifact@v4
        with:
          name: J2ME-Loader-Mod
          path: app/build/outputs/apk/dev/release/*.apk
